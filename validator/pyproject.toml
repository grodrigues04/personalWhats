[project]
name = "personal-whats-validator"
version = "1.0.0"
description = "Valida as mensagens da fila do personalWhats antes de chegarem ao WhatsApp"
requires-python = ">=3.12"
dependencies = [
  "interface-personal-whats @ git+https://github.com/grodrigues04/interface-personal-whats.git@main",
]

[dependency-groups]
dev = ["pytest", "mongomock", "black", "ruff"]

[tool.uv]
package = false

[tool.uv.sources]
# Local checkout while developing; the Docker image installs from GitHub main
interface-personal-whats = { path = "../../interface-personal-whats", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
lint.select = ["E", "W", "F", "B", "I", "N", "RUF"]
